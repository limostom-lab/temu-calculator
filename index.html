<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMU 服装成本计算器</title>
<style>
  body { font-family: -apple-system, 'PingFang SC', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; color: #6b7280; }
  .msg { text-align: center; }
  .msg a { color: #FF6B35; text-decoration: none; font-weight: 600; }
  .msg a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="msg">
  <p>正在加载…</p>
  <noscript><p>请<a href="./temuV0.6.html">点击这里</a>手动打开</p></noscript>
</div>
<script>
const DEFAULT_VERSION = 'temuV0.6.html';

(async () => {
  // 先尝试从 GitHub API 获取最新版本（3秒超时）
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    const res = await fetch('https://api.github.com/repos/limostom-lab/temu-calculator/contents/', { signal: controller.signal });
    clearTimeout(timer);
    const files = await res.json();
    const versions = files
      .filter(f => /^temuV[\d.]+\.html$/.test(f.name))
      .map(f => f.name)
      .sort();
    if (versions.length) {
      location.replace('./' + versions[versions.length - 1]);
      return;
    }
  } catch (e) {
    // API 失败（离线、限流、超时等），走兜底
  }

  // 兜底：直接跳转已知版本
  location.replace('./' + DEFAULT_VERSION);
})();
</script>
</body>
</html>
